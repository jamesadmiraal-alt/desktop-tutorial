  <rect x="0" y="0" width="64" height="64" rx="14" fill="#111827"/>
  <g transform="translate(17,17) scale(0.75)" fill="#f9fafb">
    <rect x="0"  y="2"  width="40" height="6"  rx="2"/>
    <rect x="6"  y="17" width="6"  height="11" rx="2"/>
    <rect x="17" y="12" width="6"  height="16" rx="2" fill="#fbbf24"/>
    <rect x="28" y="20" width="6"  height="8"  rx="2"/>
    <rect x="0"  y="32" width="40" height="6"  rx="2"/>
  </g>
</svg>
