# Minimal config so `submit-contact` can be called from the public landing page
# without a signed-in JWT. Other functions keep the platform default (JWT on).
[functions.submit-contact]
verify_jwt = false

# JWT ON — stated explicitly because it is modelled on submit-contact above,
# which has it OFF. This one's RLS scoping depends on knowing the caller.
[functions.notify-export-template]
verify_jwt = true

# JWT ON: the caller's own session is who is asking; org, plan and role are
# looked up from it server-side.
[functions.contact-support]
verify_jwt = true
